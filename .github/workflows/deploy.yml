name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint

      # Project site: served from /columnspaces/, so the bundle and the router
      # basename must both know it. vite.config.ts reads VITE_BASE and
      # main.tsx passes import.meta.env.BASE_URL to the router.
      - run: npm run build
        env:
          VITE_BASE: /columnspaces/

      - run: npm run test

      # SPA fallback: GitHub Pages serves 404.html for unknown paths and
      # React Router takes over from there.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
