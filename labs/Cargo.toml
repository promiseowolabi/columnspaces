[workspace]
# Crates are added here as each forge lab lands. `kit` is the shared wasm ABI
# (kslab) and is always present; the student-facing zips ship their own
# single-lab workspace manifest, generated by scripts/pack-labs.py.
members = ["kit", "encodings", "zone-maps", "vectorized", "parquet-reader", "merge-on-read", "shuffle"]
resolver = "2"
